<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — BuildMate Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-logo">
      <div class="brand-icon">🧱</div>
      <div class="logo-text"><div>BuildMate</div><div class="logo-sub">Admin Panel</div></div>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section">
        <div class="admin-nav-label">Main</div>
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="orders.html"><span class="nav-icon">📦</span> Orders</a>
        <a href="products-admin.html"><span class="nav-icon">🧱</span> Products</a>
        <a href="customers.html" class="active"><span class="nav-icon">👥</span> Customers</a>
        <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
      </div>
      <div class="admin-nav-section">
        <div class="admin-nav-label">Store</div>
        <a href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
        <a href="index.html" target="_blank"><span class="nav-icon">🌐</span> View Store</a>
      </div>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="#" class="admin-logout"><span class="nav-icon">🚪</span> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:1rem">
        <button onclick="toggleAdminSidebar()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--text)">☰</button>
        <div class="admin-topbar-title">👥 Customer List</div>
      </div>
      <div class="admin-topbar-actions">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="topbar-user"><div class="topbar-avatar">A</div>Admin</div>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-table-card">
        <div class="admin-table-header">
          <h3>All Customers</h3>
          <div class="admin-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="admin-search-input" placeholder="Search by name or phone...">
          </div>
        </div>
        <div id="customers-table" style="overflow-x:auto">
          <!-- Populated by admin.js -->
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<!-- Customer Detail Modal -->
<div id="customer-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;overflow-y:auto;padding:2rem 1rem">
  <div style="background:var(--card-bg);border-radius:var(--radius);max-width:680px;margin:0 auto;box-shadow:0 8px 40px rgba(0,0,0,0.2);overflow:hidden">

    <!-- Modal Header -->
    <div style="background:linear-gradient(135deg,var(--secondary),#34495e);color:white;padding:1.4rem 1.5rem;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:1.2rem;font-weight:800" id="cd-name">—</div>
        <div style="font-size:0.85rem;opacity:0.75;margin-top:0.2rem" id="cd-phone">—</div>
      </div>
      <button onclick="closeCustomerDetail()" style="background:rgba(255,255,255,0.15);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>

    <div style="padding:1.5rem">
      <!-- Address Card -->
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.2rem;margin-bottom:1.5rem">
        <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.8rem">📍 Delivery Address</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem">
          <div><div style="font-size:0.72rem;color:var(--text-muted);font-weight:600">Street / Area</div><div style="font-weight:700;font-size:0.9rem" id="cd-address">—</div></div>
          <div><div style="font-size:0.72rem;color:var(--text-muted);font-weight:600">Village / Town</div><div style="font-weight:700;font-size:0.9rem" id="cd-village">—</div></div>
          <div><div style="font-size:0.72rem;color:var(--text-muted);font-weight:600">District</div><div style="font-weight:700;font-size:0.9rem" id="cd-district">—</div></div>
          <div><div style="font-size:0.72rem;color:var(--text-muted);font-weight:600">PIN Code</div><div style="font-weight:700;font-size:0.9rem" id="cd-pin">—</div></div>
        </div>
      </div>

      <!-- Orders -->
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.8rem">📦 Order History</div>
      <div id="cd-orders"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>
  window.showCustomerDetail = function(phone) {
    const orders = getOrders().filter(o => o.customer.phone === phone);
    if (!orders.length) return;
    const c = orders[0].customer;

    document.getElementById('cd-name').textContent    = c.name;
    document.getElementById('cd-phone').textContent   = c.phone;
    document.getElementById('cd-address').textContent = c.address  || '—';
    document.getElementById('cd-village').textContent = c.village  || '—';
    document.getElementById('cd-district').textContent= c.district || '—';
    document.getElementById('cd-pin').textContent     = c.pin      || '—';

    const statusColors = { Pending:'var(--warning)', Confirmed:'var(--info)', Delivered:'var(--success)', Cancelled:'var(--danger)' };
    const statusIcons  = { Pending:'⏳', Confirmed:'✅', Delivered:'🏠', Cancelled:'❌' };

    document.getElementById('cd-orders').innerHTML = orders.map(o => `
      <div style="border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:0.8rem;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.7rem 1rem;background:var(--bg);flex-wrap:wrap;gap:0.5rem">
          <div>
            <span style="font-weight:800;color:var(--primary)">${o.id}</span>
            <span style="font-size:0.78rem;color:var(--text-muted);margin-left:0.6rem">${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
          </div>
          <div style="display:flex;gap:0.6rem;align-items:center">
            <span class="status-badge status-${o.status.toLowerCase()}">${statusIcons[o.status]} ${o.status}</span>
            <span style="font-weight:800;color:var(--primary)">${formatRupees(o.total)}</span>
          </div>
        </div>
        <div style="padding:0.6rem 1rem">
          ${o.items.map(i => `<div style="font-size:0.85rem;display:flex;justify-content:space-between;padding:0.25rem 0;border-bottom:1px solid var(--border)"><span>${i.name} × ${i.qty}</span><span style="font-weight:700">${formatRupees(i.total)}</span></div>`).join('')}
          <div style="font-size:0.82rem;color:var(--text-muted);margin-top:0.4rem">Payment: <strong>${o.customer.paymentMethod || 'N/A'}</strong></div>
        </div>
      </div>`).join('');

    document.getElementById('customer-modal-overlay').style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  window.closeCustomerDetail = function() {
    document.getElementById('customer-modal-overlay').style.display = 'none';
    document.body.style.overflow = '';
  };

  // Close on backdrop click
  document.getElementById('customer-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeCustomerDetail();
  });
</script>
</body>
</html>
