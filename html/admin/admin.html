<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BuildMate</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="./admin.css"></head>
<body>

<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <div class="brand-icon" style="width:56px;height:56px;background:linear-gradient(135deg,#e65c00,#f39c12);border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:1.5rem;margin:0 auto 0.8rem">
        🧱
      </div>
      <h2>BuildMate Admin</h2>
      <p>Sign in to manage your store</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="admin-login-form">
      <div class="form-group" style="margin-bottom:1rem">
        <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Username</label>
        <input type="text" id="admin-username" placeholder="Enter username"
          style="padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;width:100%;font-family:var(--font);margin-top:0.4rem;transition:border-color 0.2s"
          required autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Password</label>
        <input type="password" id="admin-password" placeholder="Enter password"
          style="padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;width:100%;font-family:var(--font);margin-top:0.4rem;transition:border-color 0.2s"
          required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">🔐 Sign In</button>
    </form>

    <div style="margin-top:1rem;text-align:center">
      <a href="../index/index.html" style="font-size:0.85rem;color:var(--text-muted)">← Back to Store</a>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<div id="spinner-overlay" class="spinner-overlay">
  <div class="spinner"></div>
  <div class="spinner-text">Logging in...</div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/app.js"></script>
<script src="./admin.js"></script>
</body>
</html>
