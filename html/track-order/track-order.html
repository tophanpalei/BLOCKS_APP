<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — BuildMate</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="./track-order.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="../index/index.html" class="nav-brand">
    <div class="brand-icon">🧱</div>
    <div>
      <div>BuildMate</div>
      <div style="font-size:0.65rem;font-weight:400;color:var(--text-muted);margin-top:-2px">Blocks & Bricks</div>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="../index/index.html">Home</a></li>
    <li><a href="../products/products.html">Products</a></li>
    <li><a href="../track-order/track-order.html" class="active">Track Order</a></li>
    <li><a href="../index/index.html#about">About</a></li>
    <li><a href="../index/index.html#contact">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <a href="../cart/cart.html" class="cart-btn">
      🛒 Cart
      <span class="cart-badge" style="display:none">0</span>
    </a>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container">
    <h1>Track Your Order</h1>
    <p>Enter your Order ID or Mobile Number to check your order status</p>
    <div class="breadcrumb">
      <a href="../index/index.html" style="color:white">Home</a>
      <span class="sep">›</span>
      <span>Track Order</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="section" style="padding-top:2.5rem">
  <div class="container">

    <!-- Search card -->
    <div class="track-search-card">
      <h3>🔍 Find Your Order</h3>
      <div class="track-tabs">
        <button class="track-tab active" id="tab-id" onclick="switchTab('id')">By Order ID</button>
        <button class="track-tab" id="tab-phone" onclick="switchTab('phone')">By Mobile Number</button>
      </div>

      <div id="input-id-wrap">
        <div class="form-group" style="margin-bottom:1rem">
          <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Order ID</label>
          <input type="text" id="search-order-id" placeholder="e.g. BM10001"
            style="width:100%;padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;font-family:var(--font);margin-top:0.4rem;box-sizing:border-box"
            onkeydown="if(event.key==='Enter') trackOrder()">
        </div>
      </div>

      <div id="input-phone-wrap" style="display:none">
        <div class="form-group" style="margin-bottom:1rem">
          <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Mobile Number</label>
          <input type="tel" id="search-phone" placeholder="e.g. 9876543210"
            style="width:100%;padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;font-family:var(--font);margin-top:0.4rem;box-sizing:border-box"
            onkeydown="if(event.key==='Enter') trackOrder()">
        </div>
      </div>

      <button class="btn-primary" style="width:100%;justify-content:center;padding:0.85rem" onclick="trackOrder()">
        🔍 Track Order
      </button>
    </div>

    <!-- Results area -->
    <div id="track-result"></div>

  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <div>© 2024 BuildMate. All rights reserved.</div>
      <div>
        <a href="../index/index.html" style="color:rgba(255,255,255,0.5);margin:0 0.5rem">Home</a>
        <a href="../products/products.html" style="color:rgba(255,255,255,0.5);margin:0 0.5rem">Products</a>
      </div>
    </div>
  </div>
</footer>

<a href="https://wa.me/919876543210" class="whatsapp-btn" target="_blank">💬</a>
<div id="toast-container" class="toast-container"></div>

<script src="../../js/config.js"></script>
<script src="../../js/app.js"></script>
<script src="./track-order.js"></script>
</body>
</html>
