<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — BuildMate Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-logo">
      <div class="brand-icon">🧱</div>
      <div class="logo-text">
        <div>BuildMate</div>
        <div class="logo-sub">Admin Panel</div>
      </div>
    </div>

    <nav class="admin-nav">
      <div class="admin-nav-section">
        <div class="admin-nav-label">Main</div>
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="orders.html" class="active"><span class="nav-icon">📦</span> Orders</a>
        <a href="products-admin.html"><span class="nav-icon">🧱</span> Products</a>
        <a href="customers.html"><span class="nav-icon">👥</span> Customers</a>
        <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
      </div>
      <div class="admin-nav-section">
        <div class="admin-nav-label">Store</div>
        <a href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
        <a href="index.html" target="_blank"><span class="nav-icon">🌐</span> View Store</a>
      </div>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="#" class="admin-logout"><span class="nav-icon">🚪</span> Logout</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:1rem">
        <button onclick="toggleAdminSidebar()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--text);display:none" id="sidebar-toggle">☰</button>
        <div class="admin-topbar-title">📦 Order Management</div>
      </div>
      <div class="admin-topbar-actions">
        <button onclick="exportOrdersCSV()" style="padding:0.45rem 1rem;background:var(--success,#27ae60);color:white;border:none;border-radius:8px;font-weight:700;font-size:0.82rem;cursor:pointer;font-family:var(--font)">📥 Export CSV</button>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="topbar-user">
          <div class="topbar-avatar">A</div>
          Admin
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Status Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="filterByStatus('all', this)">📦 All Orders</button>
        <button class="admin-tab" onclick="filterByStatus('Pending', this)">⏳ Pending</button>
        <button class="admin-tab" onclick="filterByStatus('Confirmed', this)">✅ Confirmed</button>
        <button class="admin-tab" onclick="filterByStatus('Delivered', this)">🚚 Delivered</button>
        <button class="admin-tab" onclick="filterByStatus('Cancelled', this)">❌ Cancelled</button>
        <button onclick="deleteAllCancelled()" style="margin-left:auto;padding:0.45rem 1rem;background:#e74c3c;color:white;border:none;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:var(--font)" title="Permanently delete all cancelled orders">🗑️ Delete All Cancelled</button>
      </div>

      <div class="admin-table-card">
        <div class="admin-table-header">
          <h3>All Orders</h3>
        </div>

        <!-- Global Filter Bar -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.7rem;padding:1rem 1.2rem;border-bottom:1px solid var(--border);background:var(--bg)">
          <div style="position:relative">
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem">Order ID</div>
            <input type="text" id="filter-order-id" placeholder="e.g. BM10001"
              oninput="applyFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:0.85rem;font-family:var(--font);box-sizing:border-box">
          </div>
          <div>
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem">Customer</div>
            <input type="text" id="filter-customer" placeholder="Name or phone"
              oninput="applyFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:0.85rem;font-family:var(--font);box-sizing:border-box">
          </div>
          <div>
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem">Date</div>
            <input type="date" id="filter-date"
              onchange="applyFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:0.85rem;font-family:var(--font);box-sizing:border-box">
          </div>
          <div>
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem">Status</div>
            <select id="filter-status" onchange="applyFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:0.85rem;font-family:var(--font);box-sizing:border-box">
              <option value="">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div>
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem">Payment</div>
            <select id="filter-payment" onchange="applyFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:0.85rem;font-family:var(--font);box-sizing:border-box">
              <option value="">All Payments</option>
              <option value="UPI">UPI</option>
              <option value="Cash on Delivery">Cash on Delivery</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <button onclick="clearFilters()"
              style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-muted);font-size:0.85rem;font-weight:600;font-family:var(--font);cursor:pointer">
              ✕ Clear All
            </button>
          </div>
        </div>

        <!-- Bulk Action Bar -->
        <div id="bulk-action-bar" style="display:none;padding:0.8rem 1.2rem;background:#e8f4fd;border-top:1px solid var(--border);align-items:center;gap:0.8rem;flex-wrap:wrap">
          <span id="bulk-count" style="font-size:0.88rem;font-weight:700;color:var(--text)">0 selected</span>
          <select id="bulk-status-select" style="padding:0.45rem 0.8rem;border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:var(--font);background:var(--card-bg);color:var(--text)">
            <option value="">Change status to...</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <button onclick="doBulkUpdate()" style="padding:0.45rem 1rem;background:#e65c00;color:white;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:var(--font)">✓ Apply</button>
          <button onclick="deleteSelectedOrders()" style="padding:0.45rem 1rem;background:#e74c3c;color:white;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:var(--font)" title="Delete selected cancelled orders">🗑️ Delete Selected</button>
          <button onclick="clearBulkSelection()" style="padding:0.45rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;cursor:pointer;color:var(--text-muted);font-family:var(--font)">✕ Clear</button>
        </div>

        <div id="admin-orders-table" style="overflow-x:auto">
          <!-- Populated by admin.js -->
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>
  let currentStatusFilter = 'all';

  function applyFilters() {
    const orderId  = document.getElementById('filter-order-id')?.value.trim() || '';
    const customer = document.getElementById('filter-customer')?.value.trim() || '';
    const date     = document.getElementById('filter-date')?.value || '';
    const status   = document.getElementById('filter-status')?.value || '';
    const payment  = document.getElementById('filter-payment')?.value || '';
    renderAdminOrders({ orderId, customer, date, status, payment });
  }

  function filterByStatus(status, btn) {
    currentStatusFilter = status;
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const statusEl = document.getElementById('filter-status');
    if (statusEl) statusEl.value = status === 'all' ? '' : status;
    applyFilters();
  }

  function clearFilters() {
    ['filter-order-id','filter-customer','filter-date'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    ['filter-status','filter-payment'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    currentStatusFilter = 'all';
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.admin-tab').classList.add('active');
    renderAdminOrders({});
  }

  // Show sidebar toggle on mobile
  if (window.innerWidth < 768) {
    document.getElementById('sidebar-toggle').style.display = 'block';
  }

  function deleteSelectedOrders() {
    const ids = [...document.querySelectorAll('.order-checkbox:checked')].map(c => c.value);
    if (!ids.length) { showToast('No orders selected', 'warning'); return; }
    const orders = getOrders();
    const nonCancelled = ids.filter(id => {
      const o = orders.find(o => o.id === id);
      return o && o.status !== 'Cancelled';
    });
    if (nonCancelled.length > 0) {
      showToast(`Only cancelled orders can be deleted. ${nonCancelled.length} selected order(s) are not cancelled.`, 'error');
      return;
    }
    if (!confirmAction(`Permanently delete ${ids.length} selected cancelled order(s)? This cannot be undone.`)) return;
    saveOrders(orders.filter(o => !ids.includes(o.id)));
    showToast(`${ids.length} cancelled order(s) deleted`, 'success');
    if (typeof applyFilters === 'function') applyFilters(); else renderAdminOrders();
  }

  function toggleAllOrders(cb) {
    document.querySelectorAll('.order-checkbox').forEach(c => { c.checked = cb.checked; });
    updateBulkBar();
  }

  function updateBulkBar() {
    const checked = [...document.querySelectorAll('.order-checkbox:checked')];
    const bar = document.getElementById('bulk-action-bar');
    const countEl = document.getElementById('bulk-count');
    if (!bar) return;
    bar.style.display = checked.length > 0 ? 'flex' : 'none';
    if (countEl) countEl.textContent = `${checked.length} order${checked.length !== 1 ? 's' : ''} selected`;
  }

  function doBulkUpdate() {
    const ids = [...document.querySelectorAll('.order-checkbox:checked')].map(c => c.value);
    const status = document.getElementById('bulk-status-select').value;
    if (!status) { showToast('Please select a status to apply', 'warning'); return; }
    bulkUpdateStatusAdmin(ids, status);
  }

  function clearBulkSelection() {
    document.querySelectorAll('.order-checkbox').forEach(c => { c.checked = false; });
    const allCb = document.querySelector('thead input[type="checkbox"]');
    if (allCb) allCb.checked = false;
    const bar = document.getElementById('bulk-action-bar');
    if (bar) bar.style.display = 'none';
  }
</script>
</body>
</html>
