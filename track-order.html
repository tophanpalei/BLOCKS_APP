<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — BuildMate</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .track-search-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 2rem;
      max-width: 560px;
      margin: 0 auto 2rem;
    }
    .track-search-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }
    .track-tabs {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 1.2rem;
    }
    .track-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.88rem;
      background: var(--bg);
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .track-tab.active { background: var(--primary); color: white; }

    /* ── Order result card ── */
    .order-result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      max-width: 700px;
      margin: 0 auto;
    }
    .order-result-header {
      padding: 1.2rem 1.5rem;
      background: linear-gradient(135deg, var(--secondary), #34495e);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .order-result-id { font-size: 1.3rem; font-weight: 800; }
    .order-result-date { font-size: 0.82rem; opacity: 0.7; margin-top: 0.2rem; }

    /* ── Progress tracker ── */
    .order-progress {
      padding: 1.8rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .progress-steps {
      display: flex;
      align-items: flex-start;
      position: relative;
    }
    .progress-steps::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: var(--border);
      z-index: 0;
    }
    .progress-fill {
      position: absolute;
      top: 20px;
      left: 20px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      z-index: 1;
      transition: width 0.6s ease;
    }
    .progress-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      position: relative;
      z-index: 2;
    }
    .step-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
    }
    .step-circle.done {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .step-circle.current {
      background: var(--card-bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(230,92,0,0.15);
    }
    .step-circle.cancelled {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }
    .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
    }
    .step-label.active { color: var(--primary); }
    .step-label.cancelled-label { color: var(--danger); }

    /* ── Details grid ── */
    .order-result-body { padding: 1.5rem; }
    .order-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .order-info-box {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
    }
    .order-info-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .order-info-value { font-weight: 700; font-size: 0.95rem; }

    /* ── Items list ── */
    .order-items-list { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .order-items-list-header {
      padding: 0.6rem 1rem;
      background: var(--bg);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .order-item-row:first-of-type { border-top: none; }
    .order-item-name { font-weight: 600; }
    .order-item-qty { color: var(--text-muted); font-size: 0.82rem; margin-top: 0.1rem; }
    .order-item-price { font-weight: 700; color: var(--primary); }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: rgba(230,92,0,0.05);
      border-top: 1.5px solid var(--border);
      font-weight: 800;
    }
    .order-total-row span:last-child { color: var(--primary); font-size: 1.05rem; }

    /* ── multiple results ── */
    .orders-list { display: flex; flex-direction: column; gap: 1rem; max-width: 700px; margin: 0 auto; }
    .mini-order-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: var(--transition);
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .mini-order-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .mini-order-left h4 { font-size: 1.05rem; font-weight: 800; color: var(--primary); }
    .mini-order-left p { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }

    @media(max-width:600px) {
      .order-info-grid { grid-template-columns: 1fr; }
      .progress-steps::before { top: 17px; }
      .progress-fill { top: 17px; }
      .step-circle { width: 34px; height: 34px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="brand-icon">🧱</div>
    <div>
      <div>BuildMate</div>
      <div style="font-size:0.65rem;font-weight:400;color:var(--text-muted);margin-top:-2px">Blocks & Bricks</div>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="track-order.html" class="active">Track Order</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <a href="cart.html" class="cart-btn">
      🛒 Cart
      <span class="cart-badge" style="display:none">0</span>
    </a>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container">
    <h1>Track Your Order</h1>
    <p>Enter your Order ID or Name to check your order status</p>
    <div class="breadcrumb">
      <a href="index.html" style="color:white">Home</a>
      <span class="sep">›</span>
      <span>Track Order</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="section" style="padding-top:2.5rem">
  <div class="container">

    <!-- Search card -->
    <div class="track-search-card">
      <h3>🔍 Find Your Order</h3>
      <div class="track-tabs">
        <button class="track-tab active" id="tab-id" onclick="switchTab('id')">By Order ID</button>
        <button class="track-tab" id="tab-name" onclick="switchTab('name')">By Name</button>
      </div>

      <div id="input-id-wrap">
        <div class="form-group" style="margin-bottom:1rem">
          <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Order ID</label>
          <input type="text" id="search-order-id" placeholder="e.g. BM10001"
            style="width:100%;padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;font-family:var(--font);margin-top:0.4rem;box-sizing:border-box"
            onkeydown="if(event.key==='Enter') trackOrder()">
        </div>
      </div>

      <div id="input-name-wrap" style="display:none">
        <div class="form-group" style="margin-bottom:1rem">
          <label style="font-size:0.85rem;font-weight:600;color:var(--text-light)">Customer Name</label>
          <input type="text" id="search-name" placeholder="e.g. Rahul Sharma"
            style="width:100%;padding:0.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.95rem;font-family:var(--font);margin-top:0.4rem;box-sizing:border-box"
            onkeydown="if(event.key==='Enter') trackOrder()">
        </div>
      </div>

      <button class="btn-primary" style="width:100%;justify-content:center;padding:0.85rem" onclick="trackOrder()">
        🔍 Track Order
      </button>
    </div>

    <!-- Results area -->
    <div id="track-result"></div>

  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <div>© 2024 BuildMate. All rights reserved.</div>
      <div>
        <a href="index.html" style="color:rgba(255,255,255,0.5);margin:0 0.5rem">Home</a>
        <a href="products.html" style="color:rgba(255,255,255,0.5);margin:0 0.5rem">Products</a>
      </div>
    </div>
  </div>
</footer>

<a href="https://wa.me/919876543210" class="whatsapp-btn" target="_blank">💬</a>
<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script>
  let activeTab = 'id';

  let _lastNameQuery = '';

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-id').classList.toggle('active', tab === 'id');
    document.getElementById('tab-name').classList.toggle('active', tab === 'name');
    document.getElementById('input-id-wrap').style.display = tab === 'id' ? 'block' : 'none';
    document.getElementById('input-name-wrap').style.display = tab === 'name' ? 'block' : 'none';
    document.getElementById('track-result').innerHTML = '';
  }

  // ── Status progress config ────────────────────────────────────────────────
  const STATUS_STEPS = ['Pending', 'Confirmed', 'Delivered'];

  function stepIndex(status) {
    if (status === 'Cancelled') return -1;
    return STATUS_STEPS.indexOf(status);
  }

  function buildProgressBar(status, cancelReason) {
    const idx = stepIndex(status);
    const isCancelled = status === 'Cancelled';

    const steps = [
      { label: 'Order\nPlaced', icon: '📋' },
      { label: 'Confirmed', icon: '✅' },
      { label: 'Out for\nDelivery', icon: '🚚' },
      { label: 'Delivered', icon: '🏠' },
    ];

    // Map status to step index (0-based, 3 = delivered)
    const statusToStep = { Pending: 0, Confirmed: 1, Delivered: 3 };
    const currentStep = isCancelled ? -1 : (statusToStep[status] ?? 0);
    const fillPct = isCancelled ? 0 : Math.round((currentStep / (steps.length - 1)) * 100);

    if (isCancelled) {
      const reasonHtml = cancelReason
        ? `<div style="font-size:0.85rem;color:var(--danger);margin-top:0.5rem;font-weight:600">Reason: ${cancelReason}</div>`
        : `<div style="font-size:0.82rem;color:var(--text-muted);margin-top:0.2rem">This order has been cancelled</div>`;
      return `
        <div style="text-align:center;padding:1rem 0">
          <div style="display:inline-flex;align-items:flex-start;gap:0.7rem;background:rgba(231,76,60,0.1);border:1.5px solid rgba(231,76,60,0.3);border-radius:10px;padding:0.8rem 1.5rem;text-align:left">
            <span style="font-size:1.5rem;flex-shrink:0">❌</span>
            <div>
              <div style="font-weight:800;color:var(--danger);font-size:1rem">Order Cancelled</div>
              ${reasonHtml}
            </div>
          </div>
        </div>`;
    }

    const stepsHtml = steps.map((s, i) => {
      let circleClass = '';
      let labelClass = '';
      if (i < currentStep) { circleClass = 'done'; }
      else if (i === currentStep) { circleClass = 'current'; labelClass = 'active'; }
      return `
        <div class="progress-step">
          <div class="step-circle ${circleClass}">${i <= currentStep ? (i < currentStep ? '✓' : s.icon) : s.icon}</div>
          <div class="step-label ${labelClass}">${s.label.replace('\n', '<br>')}</div>
        </div>`;
    }).join('');

    return `
      <div class="progress-steps">
        <div class="progress-fill" style="width:calc(${fillPct}% - 40px)"></div>
        ${stepsHtml}
      </div>`;
  }

  // ── Render single order detail ────────────────────────────────────────────
  function renderOrderDetail(order) {
    const statusColors = {
      Pending: 'var(--warning)', Confirmed: 'var(--info)',
      Delivered: 'var(--success)', Cancelled: 'var(--danger)'
    };
    const statusIcons = { Pending: '⏳', Confirmed: '✅', Delivered: '🏠', Cancelled: '❌' };
    const color = statusColors[order.status] || 'var(--text)';
    const icon = statusIcons[order.status] || '📦';

    const itemsHtml = order.items.map(item => `
      <div class="order-item-row">
        <div>
          <div class="order-item-name">${item.name}</div>
          <div class="order-item-qty">${item.qty} × ${formatRupees(item.price)}</div>
        </div>
        <div class="order-item-price">${formatRupees(item.total)}</div>
      </div>`).join('');

    const delivery = order.total >= 5000 ? 'Free' : formatRupees(299);

    const delivDate = order.customer.deliveryDate
      ? (() => { try { return new Date(order.customer.deliveryDate).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'}); } catch { return order.customer.deliveryDate; } })()
      : getEstimatedDelivery(5);

    return `
      <div class="order-result-card">
        <div class="order-result-header">
          <div>
            <div class="order-result-id">${order.id}</div>
            <div class="order-result-date">Placed on ${new Date(order.date).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</div>
          </div>
          <div style="background:rgba(255,255,255,0.15);border-radius:20px;padding:0.4rem 1rem;display:flex;align-items:center;gap:0.4rem;font-weight:800;font-size:0.95rem">
            ${icon} ${order.status}
          </div>
        </div>

        <div class="order-progress">
          <div style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:1.2rem">Order Progress</div>
          ${buildProgressBar(order.status, order.cancellationReason)}
        </div>

        <div class="order-result-body">
          <div class="order-info-grid">
            <div class="order-info-box">
              <div class="order-info-label">Customer</div>
              <div class="order-info-value">${order.customer.name}</div>
            </div>
            <div class="order-info-box">
              <div class="order-info-label">Phone</div>
              <div class="order-info-value">${order.customer.phone}</div>
            </div>
            <div class="order-info-box" style="grid-column:1/-1">
              <div class="order-info-label">Delivery Address</div>
              <div class="order-info-value" style="font-size:0.88rem;font-weight:600">${order.customer.address}, ${order.customer.village}, ${order.customer.district} — ${order.customer.pin}</div>
            </div>
            <div class="order-info-box">
              <div class="order-info-label">Payment</div>
              <div class="order-info-value">${order.customer.paymentMethod || 'N/A'}</div>
            </div>
            <div class="order-info-box">
              <div class="order-info-label">Est. Delivery</div>
              <div class="order-info-value" style="color:var(--success)">${delivDate}</div>
            </div>
          </div>

          <div style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.8rem">Items Ordered</div>
          <div class="order-items-list">
            ${itemsHtml}
            <div class="order-total-row">
              <span>Delivery</span><span>${delivery}</span>
            </div>
            <div class="order-total-row">
              <span>Grand Total</span><span>${formatRupees(order.total)}</span>
            </div>
          </div>

          <div style="display:flex;gap:0.8rem;margin-top:1.5rem;flex-wrap:wrap">
            <a href="products.html" class="btn-primary" style="font-size:0.9rem;padding:0.65rem 1.4rem">🛒 Order Again</a>
            <a href="https://wa.me/919876543210?text=Hi%2C%20I%20have%20a%20query%20about%20order%20${order.id}"
               target="_blank"
               style="background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:0.65rem 1.4rem;border-radius:30px;font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:0.4rem">
              💬 WhatsApp Support
            </a>
          </div>
        </div>
      </div>`;
  }

  // ── Render mini card list (when multiple orders found by phone) ───────────
  function renderOrderList(orders) {
    return `
      <div style="font-size:0.88rem;color:var(--text-muted);margin-bottom:1rem;text-align:center">
        Found <strong>${orders.length}</strong> order${orders.length > 1 ? 's' : ''} — click one to view details
      </div>
      <div class="orders-list">
        ${orders.map(o => {
          const statusColors = { Pending:'var(--warning)', Confirmed:'var(--info)', Delivered:'var(--success)', Cancelled:'var(--danger)' };
          const statusIcons = { Pending:'⏳', Confirmed:'✅', Delivered:'🏠', Cancelled:'❌' };
          return `
            <div class="mini-order-card" onclick="showSingleOrder('${o.id}')">
              <div class="mini-order-left">
                <h4>${o.id}</h4>
                <p>${o.items.map(i => i.name).join(', ').substring(0, 50)}${o.items.map(i=>i.name).join(', ').length > 50 ? '...' : ''}</p>
                <p style="margin-top:0.3rem">${new Date(o.date).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</p>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem">
                <span class="status-badge status-${o.status.toLowerCase()}">${statusIcons[o.status]} ${o.status}</span>
                <span style="font-weight:800;color:var(--primary)">${formatRupees(o.total)}</span>
              </div>
            </div>`;
        }).join('')}
      </div>`;
  }

  // ── Track by order ID ─────────────────────────────────────────────────────
  function trackOrder() {
    const resultEl = document.getElementById('track-result');

    if (activeTab === 'id') {
      const raw = document.getElementById('search-order-id').value.trim().toUpperCase();
      if (!raw) { showToast('Please enter an Order ID', 'warning'); return; }

      const order = getOrders().find(o => o.id === raw);
      if (!order) {
        resultEl.innerHTML = `
          <div style="text-align:center;max-width:560px;margin:0 auto;padding:2rem;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)">
            <div style="font-size:3rem;margin-bottom:1rem">🔎</div>
            <h3 style="margin-bottom:0.5rem">Order Not Found</h3>
            <p style="color:var(--text-muted)">No order found with ID <strong>${raw}</strong>. Please check and try again.</p>
          </div>`;
        return;
      }
      resultEl.innerHTML = renderOrderDetail(order);

    } else {
      const nameQuery = document.getElementById('search-name').value.trim().toLowerCase();
      if (!nameQuery) { showToast('Please enter a customer name', 'warning'); return; }
      _lastNameQuery = nameQuery;

      const orders = getOrders().filter(o => o.customer.name.toLowerCase().includes(nameQuery));
      if (orders.length === 0) {
        resultEl.innerHTML = `
          <div style="text-align:center;max-width:560px;margin:0 auto;padding:2rem;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)">
            <div style="font-size:3rem;margin-bottom:1rem">🔎</div>
            <h3 style="margin-bottom:0.5rem">No Orders Found</h3>
            <p style="color:var(--text-muted)">No orders found for name <strong>${nameQuery}</strong>.</p>
          </div>`;
        return;
      }
      if (orders.length === 1) {
        resultEl.innerHTML = renderOrderDetail(orders[0]);
      } else {
        resultEl.innerHTML = renderOrderList(orders);
      }
    }

    // Smooth scroll to result
    document.getElementById('track-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Drill into a single order from the list ───────────────────────────────
  function showSingleOrder(orderId) {
    const order = getOrders().find(o => o.id === orderId);
    if (!order) return;
    document.getElementById('track-result').innerHTML = `
      <button onclick="goBackToList()" style="display:flex;align-items:center;gap:0.4rem;background:none;border:none;color:var(--primary);font-weight:700;font-size:0.9rem;cursor:pointer;margin-bottom:1rem;font-family:var(--font)">
        ← Back to all orders
      </button>
      ${renderOrderDetail(order)}`;
    document.getElementById('track-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function goBackToList() {
    const orders = getOrders().filter(o => o.customer.name.toLowerCase().includes(_lastNameQuery));
    document.getElementById('track-result').innerHTML = renderOrderList(orders);
  }

  // ── Pre-fill from URL param (?id=BM10001) ────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      document.getElementById('search-order-id').value = id.toUpperCase();
      trackOrder();
    }
  });
</script>
</body>
